[package]
name = "localia-router"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "localia_router"
path = "src/lib.rs"

[[bin]]
name = "LocaliaProxyService"
path = "src/main.rs"

[dependencies]
getrandom = "=0.4.3"
plist = "=1.10.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
