[package]
name = "localia-router"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "localia_router"
path = "src/lib.rs"

[[bin]]
name = "LocaliaProxyService"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "=0.4.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["server", "http1", "tokio"] }
plist = "=1.10.4"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tower-service = "=0.3.3"
uuid = "=1.29.3"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
